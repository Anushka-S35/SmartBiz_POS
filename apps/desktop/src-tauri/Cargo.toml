[package]
name = "smartbiz-pos"
version = "0.1.0"
description = "SmartBiz POS desktop shell"
authors = ["SmartBiz POS contributors"]
edition = "2021"

[lib]
name = "smartbiz_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
